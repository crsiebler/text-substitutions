[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pysubstitutor"
version = "1.0.2"
description = "Convert text substitution files between platform-specific formats."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Cory Siebler", email = "cory.siebler@protonmail.com" },
]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "coverage==7.8.0",
    "pre-commit>=3.0",
    "pytest==7.4.2",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "ruff>=0.16.4",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/crsiebler/pysubstitutor"
Issues = "https://github.com/crsiebler/pysubstitutor/issues"
Repository = "https://github.com/crsiebler/pysubstitutor"

[project.scripts]
text-substitutions = "pysubstitutor.__main__:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["pysubstitutor*"]
exclude = ["tests*", "scripts*"]
namespaces = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
